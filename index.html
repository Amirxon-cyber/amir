<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>КЕТПЕ</title>
    <style>
        :root {
            --ink: #141428;
            --sub: #7a4fd8;
            --card: #fff;
            --mute: #8d8da6;
            --pink: #ff5d9e;
            --vio: #a06cf0;
            --blue: #6fa8ff;
            --bg: #05050a;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        * {
            box-sizing: border-box;
            margin: 0;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            height: 100%;
            background: radial-gradient(circle at 18% 12%, #fff 0, #faf7ff 45%, #f0f5ff 100%);
            font-family: Inter, "SF Pro Display", system-ui, Arial, sans-serif;
            color: var(--ink);
            overflow: hidden
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 84px
        }

        #app {
            position: relative;
            width: min(92vw, 440px);
            aspect-ratio: 9/13;
            max-height: 100%;
            overflow: hidden;
            border-radius: 34px;
            box-shadow: 0 24px 60px #7a5fd038, 0 4px 14px #0000000f;
            background: linear-gradient(160deg, #ffc3dc 0%, #d9c6ff 45%, #b9d4ff 100%)
        }

        #app:before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 15% 10%, #ff9fc8aa, transparent 45%), radial-gradient(circle at 85% 90%, #8fc1ffaa, transparent 50%)
        }

        .top {
            position: absolute;
            top: 14px;
            left: 0;
            right: 0;
            height: 34px;
            z-index: 5
        }

        .time {
            position: absolute;
            left: 18px;
            top: 8px;
            font-size: 12px;
            font-weight: 700
        }

        .bat {
            position: absolute;
            right: 18px;
            top: 12px;
            width: 20px;
            height: 9px;
            border: 1.5px solid #333;
            border-radius: 3px;
            opacity: .7
        }

        .bat:after {
            content: "";
            position: absolute;
            left: 1px;
            top: 1px;
            bottom: 1px;
            width: 60%;
            background: #333;
            border-radius: 1px
        }

        .isl {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            width: 200px;
            height: 32px;
            background: #000;
            border-radius: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 7px;
            transition: width .5s cubic-bezier(.3, 1.4, .5, 1)
        }

        .isl .cv {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            background: linear-gradient(135deg, #5a4a5a, #d9a47a 60%, #222);
            flex: none
        }

        .isl .tx {
            font-size: 9px;
            line-height: 1.15;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden
        }

        .isl .tx b {
            display: block;
            font-size: 10px
        }

        .isl .tx i {
            font-style: normal;
            opacity: .75
        }

        .isl .ic {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            background: #5aa8ff;
            flex: none;
            display: none
        }

        .isl .now {
            font-size: 8px;
            opacity: .6;
            display: none
        }

        .isl.n .cv,
        .isl.n .eq {
            display: none
        }

        .isl.n .ic,
        .isl.n .now {
            display: block
        }

        .isl.n {
            width: 236px
        }

        .eq {
            display: flex;
            gap: 2px;
            align-items: center;
            height: 14px
        }

        .eq s {
            width: 2.5px;
            border-radius: 2px;
            background: linear-gradient(#ff7fc0, #a06cf0);
            animation: eq .8s infinite ease-in-out alternate
        }

        .eq s:nth-child(1) {
            height: 5px
        }

        .eq s:nth-child(2) {
            height: 11px;
            animation-delay: .15s
        }

        .eq s:nth-child(3) {
            height: 7px;
            animation-delay: .3s
        }

        .eq s:nth-child(4) {
            height: 12px;
            animation-delay: .1s
        }

        .eq s:nth-child(5) {
            height: 6px;
            animation-delay: .25s
        }

        @keyframes eq {
            to {
                transform: scaleY(.4)
            }
        }

        #stage {
            position: absolute;
            left: 0;
            right: 0;
            top: 70px;
            bottom: 130px;
            perspective: 900px
        }

        .sl {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(24px) scale(.94) rotate(-1.2deg);
            transition: opacity .55s, transform .7s cubic-bezier(.2, 1.2, .4, 1);
            pointer-events: none
        }

        .sl.on {
            opacity: 1;
            transform: none
        }

        .sl.out {
            opacity: 0;
            transform: translateY(-20px) scale(1.03) rotate(1deg)
        }

        .card {
            width: 90%;
            background: var(--card);
            border-radius: 26px;
            padding: 14px 16px;
            box-shadow: 0 14px 36px #7a5fd04a, 0 2px 6px #0001;
            position: relative;
            overflow: hidden
        }

        .hd {
            display: flex;
            gap: 9px;
            align-items: flex-start
        }

        .ai {
            width: 20px;
            height: 20px;
            border-radius: 7px;
            flex: none;
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 11px
        }

        .hd b {
            font-size: 13px;
            display: block
        }

        .hd small {
            font-size: 10px;
            color: var(--sub);
            font-weight: 600;
            display: block;
            line-height: 1.25
        }

        .cen {
            text-align: center
        }

        .intro {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 18px;
            position: relative
        }

        .intro .cover {
            width: 84px;
            height: 84px;
            border-radius: 24px;
            background: linear-gradient(135deg, #222, #d9a47a 55%, #1a1a2a);
            box-shadow: 0 8px 20px #0004
        }

        .intro h1 {
            font-size: 34px;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ff3d8b, #a06cf0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: none
        }

        .intro p {
            font-size: 11px;
            color: #8a78b8;
            font-weight: 600;
            display: none
        }

        .intro.end h1,
        .intro.end p {
            display: block
        }

        .ring {
            position: absolute;
            width: 250px;
            height: 250px;
            left: 50%;
            top: 50%;
            margin: -125px 0 0 -125px;
            border-radius: 50%;
            border: 5px dotted #b49cf5;
            opacity: .6;
            animation: spin 14s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .call {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px
        }

        .av {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff8ac0, #a06cf0, #7fb4ff);
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: 800;
            font-size: 22px;
            box-shadow: 0 0 0 4px #bfe9d0;
            flex: none
        }

        .call h2 {
            font-size: 34px;
            font-weight: 900
        }

        .call span {
            font-size: 11px;
            color: var(--mute)
        }

        .btns {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px
        }

        .rb {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 18px
        }

        .chip {
            background: #ece8f8;
            border-radius: 14px;
            padding: 5px 13px;
            font-size: 12px;
            font-weight: 700
        }

        .msgs {
            padding: 20px 4px 60px;
            display: flex;
            flex-direction: column;
            gap: 14px
        }

        .bub {
            max-width: 70%;
            padding: 7px 13px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 700;
            opacity: 0;
            transform: translateY(8px);
            transition: .4s
        }

        .sl.on .bub {
            opacity: 1;
            transform: none
        }

        .sl.on .bub.r {
            transition-delay: 1s
        }

        .bub.l {
            background: #eeeaf6;
            align-self: flex-start
        }

        .bub.r {
            background: linear-gradient(90deg, #78a8ff, #b07cf0);
            color: #fff;
            align-self: flex-end
        }

        .loc {
            display: flex;
            gap: 14px;
            margin-top: 12px
        }

        .map {
            width: 46%;
            aspect-ratio: 1;
            border-radius: 14px;
            background: #1c1c36;
            position: relative;
            overflow: hidden;
            background-image: linear-gradient(#ffffff18 1px, transparent 1px), linear-gradient(90deg, #ffffff18 1px, transparent 1px);
            background-size: 22px 22px;
            transform: perspective(200px) rotateX(8deg)
        }

        .map:before {
            content: "";
            position: absolute;
            left: -10%;
            right: -10%;
            top: 58%;
            height: 7px;
            background: #3a64b4;
            transform: rotate(14deg)
        }

        .dot {
            position: absolute;
            left: 50%;
            top: 44%;
            width: 12px;
            height: 12px;
            margin: -6px;
            border-radius: 50%;
            background: #ff4d94;
            border: 2px solid #fff;
            box-shadow: 0 0 0 9px #ff4d9433;
            animation: pulse 1.6s infinite
        }

        @keyframes pulse {
            50% {
                box-shadow: 0 0 0 16px #ff4d9411
            }
        }

        .map em {
            position: absolute;
            left: 7px;
            bottom: 6px;
            font-size: 9px;
            color: #fff;
            font-weight: 800;
            font-style: normal
        }

        .big {
            font-size: 38px;
            font-weight: 900
        }

        .mini {
            font-size: 10px;
            color: var(--mute);
            font-weight: 700;
            margin-top: 14px
        }

        .big2 {
            font-size: 42px;
            font-weight: 900
        }

        .big2 sub {
            font-size: 14px;
            font-weight: 800
        }

        .heart {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-top: 10px
        }

        .hw {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffd3e4, #fff0f6 70%);
            box-shadow: inset 0 0 0 1px #ffb5d0, 0 0 0 8px #ffe3ee;
            display: grid;
            place-items: center;
            font-size: 56px;
            animation: beat 1s infinite
        }

        @keyframes beat {
            50% {
                transform: scale(1.07)
            }
        }

        .bpm {
            font-size: 40px;
            font-weight: 900;
            color: #ff3b30
        }

        .bpm small {
            font-size: 15px
        }

        .pill2 {
            display: inline-block;
            background: #ffe3ee;
            color: #ff6b9a;
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 800;
            margin-top: 4px
        }

        .in {
            display: flex;
            align-items: center;
            background: #f1eff8;
            border-radius: 16px;
            padding: 9px 12px;
            margin-top: 12px;
            font-size: 13px;
            font-weight: 600
        }

        .in i {
            flex: 1;
            font-style: normal
        }

        .in u {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #5aa8ff;
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 12px;
            text-decoration: none
        }

        .stats {
            display: flex;
            gap: 30px;
            margin-top: 14px;
            padding: 0 6px 8px
        }

        .stats div {
            font-size: 9px;
            color: var(--mute);
            font-weight: 700
        }

        .stats b {
            display: block;
            font-size: 22px;
            color: #777
        }

        .mus {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 6px;
            min-height: 130px
        }

        .vin {
            width: 118px;
            height: 118px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff8ac0 0 9px, #7fb4ff 10px 20px, #1d1d30 21px);
            box-shadow: 0 6px 14px #0003;
            animation: spin 4s linear infinite;
            flex: none;
            border: 4px solid #26263a
        }

        .mus h3 {
            font-size: 25px;
            font-weight: 900;
            color: #3a3a46
        }

        .mus small {
            font-size: 10px;
            color: var(--mute);
            display: block
        }

        .wave {
            display: flex;
            gap: 2px;
            align-items: center;
            height: 20px;
            margin: 6px 0
        }

        .wave s {
            width: 3px;
            border-radius: 2px;
            background: #f6a8d0;
            animation: eq .7s infinite alternate
        }

        .rep {
            background: #222236;
            color: #fff;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 11px;
            display: inline-block
        }

        .wth {
            margin-top: 8px;
            border-radius: 14px;
            height: 112px;
            background: linear-gradient(#2a2a66, #6a4aa6);
            position: relative;
            overflow: hidden
        }

        .wth i {
            position: absolute;
            bottom: 0;
            width: 15px;
            background: #2c2250;
            border-radius: 2px
        }

        .wth i:after {
            content: "";
            position: absolute;
            inset: 6px 3px;
            background: repeating-linear-gradient(#ffd06a 0 4px, transparent 4px 9px);
            opacity: .8
        }

        .wth .mn {
            position: absolute;
            right: 26px;
            top: 12px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #fff6c8;
            box-shadow: 0 0 18px #fff6c8
        }

        .row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            align-items: center;
            font-size: 11px;
            color: var(--mute);
            font-weight: 600
        }

        .row b {
            background: #171728;
            color: #fff;
            border-radius: 10px;
            padding: 5px 11px;
            font-size: 11px
        }

        .todo {
            margin-top: 10px;
            font-weight: 800;
            font-size: 13px
        }

        .todo div {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 8px 0;
            color: #ff5a5a;
            text-decoration: line-through;
            font-size: 12px
        }

        .todo i {
            width: 13px;
            height: 13px;
            border: 1.5px solid #ff5a5a;
            border-radius: 4px;
            flex: none
        }

        .come .track {
            background: #fce6f1;
            border-radius: 14px;
            height: 42px;
            margin: 8px 0;
            position: relative
        }

        .track:before {
            content: "";
            position: absolute;
            left: 12%;
            right: 12%;
            top: 50%;
            border-top: 2px dotted #f6a0c4
        }

        .track .p {
            position: absolute;
            top: 50%;
            width: 26px;
            height: 26px;
            margin-top: -13px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 10px;
            font-weight: 800;
            color: #fff
        }

        .track .a {
            left: 8%;
            background: #7a8cf0;
            transition: left 4s linear
        }

        .track .b {
            right: 6%;
            background: #ff6aa4
        }

        .sl.on .track .a {
            left: 62%
        }

        .track .d {
            position: absolute;
            left: 18%;
            top: -3px;
            font-size: 8px;
            background: #fff;
            border-radius: 6px;
            padding: 1px 5px;
            font-weight: 700
        }

        .phr {
            font-size: 36px;
            font-weight: 900;
            text-align: center;
            margin: 14px 0 10px;
            background: linear-gradient(90deg, #ff4d94, #a06cf0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            min-height: 48px;
            transition: opacity .35s, transform .35s;
            white-space: nowrap
        }

        .phr.h {
            opacity: 0;
            transform: scale(.92)
        }

        .under {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 22px;
            text-align: center;
            z-index: 4
        }

        .dots {
            display: flex;
            gap: 4px;
            justify-content: center;
            margin-bottom: 12px
        }

        .dots s {
            width: 5px;
            height: 5px;
            border-radius: 3px;
            background: #0002;
            transition: .3s
        }

        .dots s.a {
            width: 18px;
            background: #222
        }

        .by {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            background: #fffc;
            border-radius: 12px;
            padding: 3px 10px 3px 4px;
            font-size: 10px;
            font-weight: 800
        }

        .by i {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff8ac0, #7fb4ff)
        }

        .tt {
            font-weight: 900;
            font-size: 15px;
            margin: 5px 0 10px
        }

        .pr {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 28px;
            font-size: 8px;
            color: #444;
            font-weight: 700
        }

        .pr div {
            flex: 1;
            height: 3px;
            border-radius: 2px;
            background: #0002;
            position: relative
        }

        .pr div b {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            border-radius: 2px;
            background: linear-gradient(90deg, #ff5d9e, #a06cf0);
            width: 0
        }

        .pr div b:after {
            content: "";
            position: absolute;
            right: -4px;
            top: -3px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 3px #0004
        }

        .fx {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1
        }

        .fx span {
            position: absolute;
            font-size: 12px;
            font-weight: 900;
            animation: fall linear infinite;
            opacity: .8
        }

        @keyframes fall {
            from {
                transform: translateY(-20px) rotate(0)
            }

            to {
                transform: translateY(560px) rotate(360deg)
            }
        }

        .fx .ht {
            color: #ff7ab0;
            animation-name: up
        }

        @keyframes up {
            from {
                transform: translateY(40px) scale(.6);
                opacity: 0
            }

            30% {
                opacity: .9
            }

            to {
                transform: translateY(-300px) scale(1.1);
                opacity: 0
            }
        }

        #app.s-intro .top,
        #app.s-intro .under {
            opacity: 1
        }

        #app:not(.go) * {
            animation-play-state: paused !important
        }

        .play {
            position: absolute;
            inset: 0;
            z-index: 9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: #ffffff66;
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
            transition: opacity .5s
        }

        .play.h {
            opacity: 0;
            pointer-events: none
        }

        .play button {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            border: 0;
            font-size: 32px;
            padding-left: 6px;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(135deg, #ff5d9e, #a06cf0);
            box-shadow: 0 10px 30px #a06cf070;
            animation: beat 1.6s infinite
        }

        .play span {
            font-size: 12px;
            font-weight: 800;
            color: #5b4b8a;
            letter-spacing: .4px
        }

        .quote {
            position: fixed;
            left: 0;
            right: 0;
            bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            text-align: center;
            padding: 0 22px;
            font-size: 13px;
            line-height: 1.45;
            color: #5b4b8a;
            font-style: italic;
            font-weight: 500
        }

        .quote b {
            display: block;
            margin-top: 3px;
            font-style: normal;
            font-size: 11px;
            letter-spacing: .6px;
            color: #a06cf0;
            font-weight: 800
        }
    </style>
</head>

<body>
    <div id="app" class="s-intro">
        <div class="fx" id="fx"></div>
        <div class="play" id="play"><button id="pb" aria-label="Play">▶</button><span>Нажми, чтобы начать</span></div>
        <div class="top">
            <div class="time">03:00</div>
            <div class="isl" id="isl">
                <div class="cv"></div>
                <div class="ic" id="ic"></div>
                <div class="tx"><b id="it">КЕТПЕ</b><i id="is">Dasdinlovee</i></div><span class="now">сейчас</span>
                <div class="eq"><s></s><s></s><s></s><s></s><s></s></div>
            </div>
            <div class="bat"></div>
        </div>
        <div id="stage"></div>
        <div class="under">
            <div class="dots" id="dots"></div>
            <div class="by"><i></i>автор: zenxx</div>
            <div class="tt">Dasdinlovee</div>
            <div class="pr"><span id="t1">0:00</span>
                <div><b id="bar"></b></div><span id="t2">-0:29</span>
            </div>
        </div>
